<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4a6fa5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Stock Control Task Board</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #166088;
            --accent-color: #4fc3f7;
            --background-color: #f8f9fa;
            --card-color: #ffffff;
            --text-color: #333333;
            --text-light: #666666;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --danger-color: #f44336;
            --border-radius: 12px;
            --box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        :root.dark {
            --primary-color: #6ba3d6;
            --secondary-color: #4a8bc6;
            --accent-color: #4fc3f7;
            --background-color: #121212;
            --card-color: #1e1e1e;
            --text-color: #e0e0e0;
            --text-light: #a0a0a0;
            --success-color: #66bb6a;
            --warning-color: #ffb74d;
            --danger-color: #ef5350;
            --box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            transition: var(--transition);
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            width: min(1200px, calc(100% - 32px));
            margin: 0 auto;
            padding: 20px 0 40px;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--box-shadow);
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: scale(1.08);
            background-color: var(--secondary-color);
        }

        .login-section {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--background-color);
            padding: 20px;
        }

        .login-box {
            background-color: var(--card-color);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-box h2 {
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: clamp(1.6rem, 4vw, 2rem);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color);
        }

        .form-group input,
        .form-group textarea,
        .status-filter select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 16px;
            background-color: var(--card-color);
            color: var(--text-color);
            transition: var(--transition);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .status-filter select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.2);
        }

        .login-box button,
        .logout-btn,
        .actions button {
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .login-box button:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        #errorMessage {
            color: var(--danger-color);
            margin-top: 15px;
            font-weight: 600;
            min-height: 24px;
        }

        #mainContent {
            display: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: clamp(1.8rem, 4vw, 2.4rem);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-radius: var(--border-radius);
            background-color: var(--card-color);
            box-shadow: var(--box-shadow);
            flex-wrap: wrap;
        }

        .user-info i {
            font-size: 20px;
            color: var(--primary-color);
        }

        .logout-btn {
            background-color: var(--danger-color);
            color: white;
            padding: 10px 12px;
            margin-left: 10px;
        }

        .logout-btn:hover {
            background-color: #d32f2f;
        }

        .task-form,
        .archive-section {
            background-color: var(--card-color);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            margin-bottom: 30px;
        }

        .task-form h2,
        .archive-section h2 {
            color: var(--secondary-color);
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        .status-filter {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .status-filter label {
            font-weight: 600;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 760px;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: var(--card-color);
            box-shadow: var(--box-shadow);
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: rgba(74, 111, 165, 0.08);
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .status.pending {
            background-color: rgba(255, 152, 0, 0.2);
            color: var(--warning-color);
        }

        .status.completed {
            background-color: rgba(76, 175, 80, 0.2);
            color: var(--success-color);
        }

        .status.overdue {
            background-color: rgba(244, 67, 54, 0.2);
            color: var(--danger-color);
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .actions button {
            padding: 8px 12px;
            font-size: 14px;
            color: white;
        }

        .complete-btn { background-color: var(--success-color); }
        .complete-btn:hover { background-color: #3e8e41; }

        .archive-btn { background-color: var(--accent-color); }
        .archive-btn:hover { background-color: #3ab7f5; }

        .delete-btn { background-color: var(--danger-color); }
        .delete-btn:hover { background-color: #d32f2f; }

        .restore-btn { background-color: #9e9e9e; }
        .restore-btn:hover { background-color: #757575; }

        .archive-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .container {
                width: min(100%, calc(100% - 20px));
                padding-top: 16px;
            }

            .login-box,
            .task-form,
            .archive-section {
                padding: 20px 16px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .user-info {
                width: 100%;
                justify-content: space-between;
            }

            .logout-btn {
                margin-left: 0;
            }

            .table-wrapper {
                overflow-x: auto;
            }

            table {
                min-width: 620px;
            }
        }

        @media (max-width: 560px) {
            .theme-toggle {
                top: 12px;
                right: 12px;
                width: 46px;
                height: 46px;
            }

            .status-filter {
                align-items: stretch;
            }

            .status-filter select {
                width: 100%;
            }

            .user-info {
                padding: 10px 12px;
                font-size: 14px;
            }

            .actions {
                gap: 6px;
            }

            .actions button {
                flex: 1 1 42px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Przełącz motyw">
        <i class="fas fa-moon"></i>
    </button>

    <div id="loginSection" class="login-section">
        <div class="login-box">
            <h2>🔒 Zaloguj się</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="password">Hasło:</label>
                    <input type="password" id="password" placeholder="WPISZ HASŁO" required />
                </div>
                <button type="button" onclick="login()">
                    <i class="fas fa-sign-in-alt"></i> Zaloguj
                </button>
            </form>
            <p id="errorMessage"></p>
        </div>
    </div>

    <div id="mainContent" class="container">
        <div class="header">
            <h1>📋 Stock Control Task Board</h1>
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span>Zalogowany użytkownik</span>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Wyloguj
                </button>
            </div>
        </div>

        <div class="task-form">
            <h2>📝 Dodaj nowe zadanie</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label for="orderDate">Data zlecenia:</label>
                    <input type="date" id="orderDate" required />
                </div>
                <div class="form-group">
                    <label for="assignedTo">Komu zlecono:</label>
                    <input type="text" id="assignedTo" placeholder="Imię lub dział" required />
                </div>
                <div class="form-group">
                    <label for="productName">Nazwa produktu:</label>
                    <input type="text" id="productName" placeholder="Produkt / magazyn / pozycja" required />
                </div>
                <div class="form-group">
                    <label for="quantity">Ilość:</label>
                    <input type="number" id="quantity" min="1" placeholder="np. 25" required />
                </div>
                <div class="form-group">
                    <label for="dueDate">Termin realizacji:</label>
                    <input type="date" id="dueDate" required />
                </div>
                <div class="form-group">
                    <label for="notes">Uwagi:</label>
                    <textarea id="notes" placeholder="Dodatkowe informacje"></textarea>
                </div>
                <button type="submit" style="width:100%; background: var(--primary-color); color:white; border:none; border-radius: var(--border-radius); padding: 12px; cursor:pointer; font-size:16px; font-weight:600;">
                    <i class="fas fa-plus"></i> Dodaj zadanie
                </button>
            </form>
        </div>

        <div class="status-filter">
            <label for="statusFilter">Filtr:</label>
            <select id="statusFilter" onchange="renderTasks()">
                <option value="all">Wszystkie</option>
                <option value="pending">Do zrobienia</option>
                <option value="completed">Zakończone</option>
                <option value="overdue">Po terminie</option>
            </select>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Data zlecenia</th>
                        <th>Komu zlecono</th>
                        <th>Produkt</th>
                        <th>Ilość</th>
                        <th>Termin</th>
                        <th>Status</th>
                        <th>Uwagi</th>
                        <th>Akcje</th>
                    </tr>
                </thead>
                <tbody id="tasksTableBody"></tbody>
            </table>
        </div>

        <div class="archive-section">
            <h2>🗄️ Archiwum zadań</h2>
            <div id="archiveList"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'stock-control-board';
        const SESSION_KEY = 'stock-control-logged-in';

        const defaultTasks = [
            {
                id: crypto.randomUUID(),
                orderDate: '2026-09-20',
                assignedTo: 'Magazyn A',
                productName: 'Płyn do mycia',
                quantity: 15,
                dueDate: '2026-09-24',
                notes: 'Dostawa dla działu produkcji',
                status: 'pending',
                archived: false
            },
            {
                id: crypto.randomUUID(),
                orderDate: '2026-09-18',
                assignedTo: 'Dział sprzedaży',
                productName: 'Zestaw etykiet',
                quantity: 40,
                dueDate: '2026-09-19',
                notes: 'Wymagane do kampanii',
                status: 'overdue',
                archived: false
            }
        ];

        function getTasks() {
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
            if (!data || !Array.isArray(data) || data.length === 0) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultTasks));
                return defaultTasks;
            }
            return data;
        }

        function saveTasks(tasks) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function getStatus(task) {
            const today = new Date();
            const due = new Date(task.dueDate + 'T00:00:00');
            if (task.status === 'completed') return 'completed';
            if (due < today) return 'overdue';
            return 'pending';
        }

        function login() {
            const password = document.getElementById('password').value.trim();
            if (!password) {
                document.getElementById('errorMessage').textContent = 'Wpisz hasło.';
                return;
            }
            localStorage.setItem(SESSION_KEY, 'true');
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('errorMessage').textContent = '';
            renderTasks();
        }

        function logout() {
            localStorage.removeItem(SESSION_KEY);
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('password').value = '';
            document.getElementById('errorMessage').textContent = '';
        }

        function toggleTheme() {
            const root = document.documentElement;
            root.classList.toggle('dark');
        }

        function renderTasks() {
            const tasks = getTasks();
            const tableBody = document.getElementById('tasksTableBody');
            const filter = document.getElementById('statusFilter').value;

            const visibleTasks = tasks.filter(task => {
                if (task.archived) return false;
                const status = getStatus(task);
                return filter === 'all' || status === filter;
            });

            if (visibleTasks.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="8">Brak zadań dla tego filtra.</td></tr>';
            } else {
                tableBody.innerHTML = visibleTasks.map(task => {
                    const status = getStatus(task);
                    return `
                        <tr>
                            <td data-label="Data zlecenia">${task.orderDate}</td>
                            <td data-label="Komu zlecono">${task.assignedTo}</td>
                            <td data-label="Produkt">${task.productName}</td>
                            <td data-label="Ilość">${task.quantity}</td>
                            <td data-label="Termin">${task.dueDate}</td>
                            <td data-label="Status"><span class="status ${status}">${status === 'pending' ? 'do zrobienia' : status === 'completed' ? 'zakończone' : 'po terminie'}</span></td>
                            <td data-label="Uwagi">${task.notes || '-'}</td>
                            <td data-label="Akcje">
                                <div class="actions">
                                    <button class="complete-btn" data-id="${task.id}" data-action="complete" aria-label="Zaznacz jako zakończone"><i class="fas fa-check"></i></button>
                                    <button class="archive-btn" data-id="${task.id}" data-action="archive" aria-label="Archiwizuj"><i class="fas fa-archive"></i></button>
                                    <button class="delete-btn" data-id="${task.id}" data-action="delete" aria-label="Usuń"><i class="fas fa-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            const archiveList = document.getElementById('archiveList');
            const archived = tasks.filter(task => task.archived);
            if (archived.length === 0) {
                archiveList.innerHTML = '<p>Brak zadań w archiwum.</p>';
            } else {
                archiveList.innerHTML = archived.map(task => `
                    <div class="archive-item">
                        <div>
                            <strong>${task.productName}</strong><br>
                            <small>${task.assignedTo} • ${task.dueDate}</small>
                        </div>
                        <button class="restore-btn" data-id="${task.id}" data-action="restore" style="padding:8px 12px; color:white; border:none; border-radius:var(--border-radius); cursor:pointer;">
                            <i class="fas fa-undo"></i> Przywróć
                        </button>
                    </div>
                `).join('');
            }

            bindActions();
        }

        function bindActions() {
            document.querySelectorAll('[data-action]').forEach(button => {
                button.onclick = () => {
                    const id = button.getAttribute('data-id');
                    const action = button.getAttribute('data-action');
                    const tasks = getTasks();
                    const taskIndex = tasks.findIndex(task => task.id === id);
                    if (taskIndex === -1) return;

                    if (action === 'complete') {
                        tasks[taskIndex].status = 'completed';
                    }
                    if (action === 'archive') {
                        tasks[taskIndex].archived = true;
                    }
                    if (action === 'delete') {
                        tasks.splice(taskIndex, 1);
                    }
                    if (action === 'restore') {
                        tasks[taskIndex].archived = false;
                        tasks[taskIndex].status = 'pending';
                    }

                    saveTasks(tasks);
                    renderTasks();
                };
            });
        }

        document.getElementById('taskForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const task = {
                id: crypto.randomUUID(),
                orderDate: document.getElementById('orderDate').value,
                assignedTo: document.getElementById('assignedTo').value,
                productName: document.getElementById('productName').value,
                quantity: Number(document.getElementById('quantity').value),
                dueDate: document.getElementById('dueDate').value,
                notes: document.getElementById('notes').value,
                status: 'pending',
                archived: false
            };

            const tasks = getTasks();
            tasks.unshift(task);
            saveTasks(tasks);
            this.reset();
            renderTasks();
        });

        function initialize() {
            const isLogged = localStorage.getItem(SESSION_KEY) === 'true';
            if (isLogged) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            }
            renderTasks();
        }

        initialize();
    </script>
</body>
</html>
